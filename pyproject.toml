[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "ISC", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["soloscale"]

[[tool.mypy.overrides]]
module = ["buildlog", "buildlog.*"]
ignore_missing_imports = true
