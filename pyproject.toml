"share/soloscale-ai-os/.agents/skills/evidence-refresh-and-bundle/examples" = [".agents/skills/evidence-refresh-and-bundle/examples/example.md"]
"share/soloscale-ai-os/.agents/skills/learning-gap-to-packet" = [
