[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soloscale-ai-os"
version = "0.4.1"
description = "Human-controlled AI workflow, evidence, and private retrieval system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "google-genai>=1.0,<2",
  "google-api-python-client>=2.190,<3",
  "google-auth>=2.40,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "Pillow>=12,<13",
  "pypdf>=6.10,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
desktop = [
  "pyinstaller>=6.21,<7",
]

[project.scripts]
soloscale = "soloscale.cli:app"
soloscale-ui = "soloscale.local_ui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soloscale = ["content_data/*.json"]

[tool.setuptools.data-files]
"share/soloscale-ai-os/.agents" = [".agents/README.md"]
"share/soloscale-ai-os/.agents/task-templates" = [
  ".agents/task-templates/high-level-request.md",
  ".agents/task-templates/run-receipt.schema.json",
  ".agents/task-templates/task-envelope.schema.json",
]
"share/soloscale-ai-os/.agents/skills" = [".agents/skills/registry.yaml"]
"share/soloscale-ai-os/.agents/skills/editorial-package" = [
  ".agents/skills/editorial-package/CHANGELOG.md",
  ".agents/skills/editorial-package/SKILL.md",
  ".agents/skills/editorial-package/contract.schema.json",
]
"share/soloscale-ai-os/.agents/skills/editorial-package/agents" = [".agents/skills/editorial-package/agents/openai.yaml"]
"share/soloscale-ai-os/.agents/skills/editorial-package/examples" = [".agents/skills/editorial-package/examples/example.md"]
"share/soloscale-ai-os/.agents/skills/evidence-refresh-and-bundle" = [
  ".agents/skills/evidence-refresh-and-bundle/CHANGELOG.md",
  ".agents/skills/evidence-refresh-and-bundle/SKILL.md",
  ".agents/skills/evidence-refresh-and-bundle/contract.schema.json",
